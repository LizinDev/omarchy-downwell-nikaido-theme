# downwell-nikaido override for [lock], written by tools/shell-overrides.py.
# A section override REPLACES the whole section, so every generated key is
# restated; hex values are frozen copies of colors.toml - re-run the tool
# after any palette change.
# Lock screen password input. background/background-alpha control the
# centered input field card; border/border-active/border-error cycle
# through idle, typing/authenticating, and wrong-password states.
# border-alpha applies to all three border states (they are mutually
# exclusive in time).
background       = "#1a1a0c"
background-alpha = 0.9
text             = "#e8e7da"
placeholder      = "#a2a194"
text-error       = "#f5453a"
border           = "#5f5e52"
border-active    = "hyprland.active-border"
border-error     = "#f5453a"
border-alpha     = 1.0
# selection is the text-selection tint inside the input field.
selection        = "#fe9300"
selection-alpha  = 0.45
